<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloudinary Image Gallery</title>
    <script
        src="https://upload-widget.cloudinary.com/latest/global/all.js"
        type="text/javascript">
    </script>

    <style>
        body {
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .gallery-layout {
            width: 90%;
            margin: 20px auto;
        }

        .gallery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .upload-btn {
            padding: 10px 20px;
            background: #3498db;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 6px;
            color: white;
            transition: 0.3s;
        }

        .upload-btn:hover {
            background: #2980b9;
        }

        .image-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .image-container .image-item {
            position: relative;
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .image-container .image-item:hover {
            transform: scale(1.03);
        }

        .image-container img {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: red;
            padding: 6px;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 16px;
            cursor: pointer;
            color: white;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .image-item:hover .delete-btn {
            opacity: 1;
        }

        /* POPUP STYLING + ANIMATION */
        .popup-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            animation: fadeIn 0.4s ease forwards;
        }

        .popup-box {
            background: #222;
            padding: 15px;
            border-radius: 10px;
            animation: scaleUp 0.4s ease forwards;
        }

        .popup-img {
            max-width: 90vw;
            max-height: 80vh;
            border-radius: 10px;
        }

        .popup-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 50px;
            color: white;
            cursor: pointer;
        }

        /* ANIMATIONS */
        @keyframes scaleUp {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes deleteFadeOut {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.5); }
        }
    </style>
</head>

<body>
    <div class="gallery-layout">
        <div class="gallery-header">
            <h2>📸 Cloudinary Image Gallery</h2>
            <button class="upload-btn" id="upload-widget">+ Upload Image</button>
        </div>

        <div class="image-container" id="uploaded-images"></div>
    </div>

    <!-- Popup -->
    <div class="popup-container" id="popup">
        <span class="popup-close" onclick="closePopup()">×</span>
        <div class="popup-box">
            <img id="popup-img" class="popup-img" src="" />
        </div>
    </div>

    <script>
        const cloudName = "dcr3dfgik";
        const unsignedUploadPreset = "ml_default";

        // ✅ Create Cloudinary Upload Widget
        const myWidget = cloudinary.createUploadWidget(
            {
                cloudName: cloudName,
                uploadPreset: unsignedUploadPreset
            },
            (error, result) => {
                if (!error && result && result.event === "success") {
                    console.log("Image uploaded:", result.info.secure_url);
                    displayImage(result.info.secure_url);
                }
            }
        );

        document.getElementById("upload-widget").onclick = function () {
            myWidget.open();
        };

        function displayImage(url) {
            const imageContainer = document.getElementById("uploaded-images");

            const imageItem = document.createElement("div");
            imageItem.className = "image-item";

            imageItem.innerHTML = `
                <button class="delete-btn">×</button>
                <img src="${url}" onclick="openPopup('${url}')">
            `;

            imageContainer.appendChild(imageItem);

            // ✅ Delete Animation
            imageItem.querySelector(".delete-btn").onclick = function (e) {
                e.stopPropagation();
                imageItem.style.animation = "deleteFadeOut 0.4s ease forwards";
                setTimeout(() => imageItem.remove(), 400);
            };
        }

        function openPopup(url) {
            const popup = document.getElementById("popup");
            document.getElementById("popup-img").src = url;
            popup.style.display = "flex";
        }

        function closePopup() {
            document.getElementById("popup").style.display = "none";
        }
    </script>

</body>
</html>
