<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tashu Cloudinary Gallery — Blue Remix</title>

  <style>
    :root{
      --blue1:#e6f6ff;
      --blue2:#ccf0ff;
      --accent:#3aa0ff;
      --soft:#bfe9ff;
      --panel:#0b0b0d;
      --card-radius:12px;
      --gutter:14px;
      --shadow: 0 18px 40px rgba(10,20,30,.42);
      --muted:#9bb7d8;
    }
    *{box-sizing:border-box}
    body{
      margin:18px;
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      background: radial-gradient(600px 200px at 10% 0%, rgba(58,160,255,.06), transparent 20%),
                  linear-gradient(180deg,var(--blue1),var(--blue2));
      color:#062134;
    }

    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;}
    .brand{display:flex;align-items:center;gap:12px;}
    .logo{
      width:54px;height:54px;border-radius:14px;
      background:linear-gradient(135deg,var(--accent),#7fd1ff);
      display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px;box-shadow:var(--shadow);
    }
    h1{margin:0;font-size:20px;color:#024;}
    p.lead{margin:0;color:var(--muted);font-size:13px}

    .controls{display:flex;gap:10px;align-items:center}
    .btn{
      display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;border:0;cursor:pointer;font-weight:700;
      background:linear-gradient(90deg,var(--accent),#6ecbff);color:#021831;
    }
    input[type=file]{display:none}

    .stage{
      background: linear-gradient(180deg,#07070a,#0e1220 80%);
      border-radius:18px;
      padding:20px;
      margin-top:18px;
      box-shadow: 0 28px 80px rgba(4,10,20,.6);
      border: 1px solid rgba(255,255,255,.03);
    }
    .stage-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;color:var(--muted)}
    .stage-title{color:#e6f7ff;font-weight:800;}

    #gallery{
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap:var(--gutter);
    }

    .tile{
      position:relative;
      border-radius:var(--card-radius);
      overflow:hidden;
      min-height:130px;
      background:rgba(255,255,255,.02);
      border:1px solid rgba(255,255,255,.03);
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
      transition:.28s;
    }

    .tile:hover{ transform: translateY(-6px) scale(1.02); }

    .tile img{
      width:100%; height:100%; object-fit:cover;
      transition: transform .45s ease;
    }
    .tile:hover img{ transform: scale(1.05); }

    .delete-btn{
      position:absolute; right:10px; top:10px;
      width:40px;height:40px;border-radius:50%;
      background:#000;color:#fff;display:grid;place-items:center;
      cursor:pointer;z-index:6;
    }

    .like-btn{
      position:absolute;
      bottom:10px;
      left:10px;
      font-size:26px;
      cursor:pointer;
      user-select:none;
      color:white;
      opacity:0.9;
      transition:transform .2s ease;
    }
    .like-btn.liked{ transform:scale(1.3); color:red; }
    .like-count{
      position:absolute;
      bottom:12px;
      left:48px;
      color:white;
      font-size:18px;
    }

    #popup {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    #popup img {
      max-width: 95vw;
      max-height: 90vh;
      border-radius: 14px;
      animation: zoomIn .45s ease forwards;
    }
    @keyframes zoomIn {
      0% { transform: scale(.4); opacity: 0; }
      60% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); }
    }

    /* ✅ Popup message for already liked */
    #like-warning {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff4d4d;
      color: white;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 10px;
      display: none;
      animation: fadeIn .3s ease;
      z-index: 10000;
    }
    @keyframes fadeIn {
      from { opacity:0; transform:translateX(-50%) translateY(10px); }
      to { opacity:1; transform:translateX(-50%) translateY(0); }
    }
  </style>
</head>

<body>

<div id="like-warning">You already liked this picture!</div>

<header>
  <div class="brand">
    <div class="logo">A</div>
    <div>
      <h1>💙 ALOK'S BLUE GALLERY</h1>
      <p class="lead">Upload photos — they’ll land on the black stage with animations.</p>
    </div>
  </div>

  <div class="controls">
    <label for="uploader" class="btn">＋ Upload</label>
    <input id="uploader" type="file" accept="image/*" />
    <button id="refresh" class="btn">Refresh</button>
  </div>
</header>

<main class="stage">
  <div class="stage-head">
    <div class="stage-title">Photos</div>
    <div id="count">—</div>
  </div>

  <div id="gallery"></div>
  <div id="status">Loading images…</div>
</main>

<div id="popup" onclick="closePopup()">
  <img id="popup-img" src="" alt="">
</div>

<script>
const CLOUD_NAME = 'dkmk0hsfk';
const UPLOAD_PRESET = 'unsigned_gallery';
const FOLDER = 'gallery';

function showWarning() {
  const w = document.getElementById("like-warning");
  w.style.display = "block";
  setTimeout(() => w.style.display = "none", 1500);
}

function showPopup(src){
  document.getElementById('popup-img').src = src;
  document.getElementById('popup').style.display = 'flex';
}
function closePopup(){
  document.getElementById('popup').style.display = 'none';
}

function createTile(imgObj){
  const d = document.createElement('div');
  d.className = 'tile';
  d.dataset.id = imgObj.public_id;

  const src = imgObj.secure_url.replace('/upload/', '/upload/q_auto,f_auto,w_1100,h_900,c_fill/');
  const img = document.createElement('img');
  img.src = src;
  d.appendChild(img);

  d.addEventListener('click',()=> showPopup(src));

  // ✅ LIKE STORAGE LOGIC
  const likeKey = "liked_" + imgObj.public_id;
  const countKey = "count_" + imgObj.public_id;

  let liked = localStorage.getItem(likeKey) === "true";
  let count = parseInt(localStorage.getItem(countKey) || "0");

  const like = document.createElement("span");
  like.className = "like-btn";
  like.innerHTML = "❤️";
  if(liked) like.classList.add("liked");

  const likeCount = document.createElement("span");
  likeCount.className = "like-count";
  likeCount.textContent = count;

  like.onclick = function(e){
    e.stopPropagation();

    if(liked){
      showWarning();
      return;
    }

    liked = true;
    count++;

    like.classList.add("liked");
    likeCount.textContent = count;

    localStorage.setItem(likeKey, "true");
    localStorage.setItem(countKey, count);
  };

  d.appendChild(like);
  d.appendChild(likeCount);

  return d;
}

async function fetchImages(){
  const res = await fetch('/.netlify/functions/list-images');
  const json = await res.json();
  document.getElementById("gallery").innerHTML = '';
  const items = json.images || json.resources || [];
  items.forEach(i=> document.getElementById("gallery").appendChild(createTile(i)));
}

fetchImages();
</script>

</body>
</html>
