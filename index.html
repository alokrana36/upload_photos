<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tashu Cloudinary Gallery — Blue Remix</title>

  <style>
    :root{
      --blue1:#e6f6ff;
      --blue2:#ccf0ff;
      --accent:#3aa0ff;
      --soft:#bfe9ff;
      --panel:#0b0b0d;
      --card-radius:12px;
      --gutter:14px;
      --shadow: 0 18px 40px rgba(10,20,30,.42);
      --muted:#9bb7d8;
    }
    *{box-sizing:border-box}
    body{
      margin:18px;
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      background: radial-gradient(600px 200px at 10% 0%, rgba(58,160,255,.06), transparent 20%),
                  linear-gradient(180deg,var(--blue1),var(--blue2));
      color:#062134;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    header{
      display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;
    }
    .brand{
      display:flex;align-items:center;gap:12px;
    }
    .logo{
      width:54px;height:54px;border-radius:14px;
      background:linear-gradient(135deg,var(--accent),#7fd1ff);
      display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px;box-shadow:var(--shadow);
    }
    h1{margin:0;font-size:20px;color:#024;letter-spacing:.2px}
    p.lead{margin:0;color:var(--muted);font-size:13px}

    .controls{display:flex;gap:10px;align-items:center}
    .btn{
      display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;border:0;cursor:pointer;font-weight:700;
      background:linear-gradient(90deg,var(--accent),#6ecbff);color:#021831;box-shadow: 0 10px 30px rgba(10,150,255,.12);
    }
    input[type=file]{display:none}

    .stage{
      background: linear-gradient(180deg,#07070a,#0e1220 80%);
      border-radius:18px;
      padding:20px;
      margin-top:18px;
      box-shadow: 0 28px 80px rgba(4,10,20,.6);
      border: 1px solid rgba(255,255,255,.03);
    }
    .stage-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;color:var(--muted)}
    .stage-title{color:#e6f7ff;font-weight:800;letter-spacing:.6px}

    #gallery{
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap:var(--gutter);
    }

    .tile{
      position:relative;
      border-radius:var(--card-radius);
      overflow:hidden;
      background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01));
      border:1px solid rgba(255,255,255,.03);
      min-height:130px;
      display:block;
      transform-origin:center;
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
      transition: transform .28s cubic-bezier(.2,.9,.2,1), box-shadow .2s;
      will-change: transform, opacity;
    }

    .tile:hover{ transform: translateY(-6px) scale(1.02); box-shadow: 0 32px 60px rgba(0,0,0,.6); }

    .tile img{
      width:100%; height:100%; object-fit:cover; display:block; min-height:110px;
      transition: transform .45s ease;
      transform-origin:center;
    }
    .tile:hover img{ transform: scale(1.05); }

    .delete-btn{
      position:absolute; right:10px; top:10px; z-index:6;
      width:40px;height:40px;border-radius:50%;border:0;background:#000;color:#fff;
      display:grid;place-items:center;font-weight:900;cursor:pointer;box-shadow: 0 10px 30px rgba(0,0,0,.55);
      transition: transform .18s ease, opacity .12s;
      opacity:.96;
    }
    .delete-btn:hover{ transform: scale(1.06) rotate(-6deg); }
    .delete-btn:active{ transform: scale(.98) rotate(-2deg); }

    /* Like Button */
    .like-btn{
      position:absolute;
      bottom:10px;
      left:10px;
      font-size:26px;
      cursor:pointer;
      user-select:none;
      color:white;
      opacity:0.9;
      transition:transform .2s ease;
    }
    .like-btn.liked{ transform:scale(1.3); color:red; }
    .like-count{
      position:absolute;
      bottom:12px;
      left:48px;
      color:white;
      font-size:18px;
    }

    /* ----------- NEW POPUP ANIMATION ----------- */
    #popup {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.8);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    #popup img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,.6);
      animation: zoomIn .45s ease forwards;
    }
    @keyframes zoomIn {
      0% { transform: scale(.4) rotate(-6deg); opacity: 0; }
      60% { transform: scale(1.05) rotate(3deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <div class="logo">A</div>
      <div>
        <h1>💙 ALOK'S BLUE GALLERY</h1>
        <p class="lead">Upload photos — they’ll land on the black stage with animations.</p>
      </div>
    </div>

    <div class="controls">
      <label for="uploader" class="btn">＋ Upload</label>
      <input id="uploader" type="file" accept="image/*" />
      <button id="refresh" class="btn">Refresh</button>
    </div>
  </header>

  <main class="stage">
    <div class="stage-head">
      <div class="stage-title">Photos</div>
      <div id="count">—</div>
    </div>

    <div id="gallery"></div>
    <div id="status">Loading images…</div>
  </main>

  <!-- ✅ POPUP BIG VIEW -->
  <div id="popup" onclick="closePopup()">
    <img id="popup-img" src="" alt="preview">
  </div>

  <script>
    const CLOUD_NAME = 'dkmk0hsfk';
    const UPLOAD_PRESET = 'unsigned_gallery';
    const FOLDER = 'gallery';

    const uploader = document.getElementById('uploader');
    const galleryEl = document.getElementById('gallery');
    const statusEl = document.getElementById('status');
    const countEl = document.getElementById('count');
    const refreshBtn = document.getElementById('refresh');

    function setStatus(s){ statusEl.textContent = s; }
    function setCount(n){ countEl.textContent = n + ' photos'; }

    function showPopup(src){
      document.getElementById('popup-img').src = src;
      document.getElementById('popup').style.display = 'flex';
    }
    function closePopup(){ document.getElementById('popup').style.display = 'none'; }

    function createTile(imgObj){
      const d = document.createElement('div');
      d.className = 'tile';
      d.dataset.publicId = imgObj.public_id;

      const src = imgObj.secure_url.replace('/upload/', '/upload/q_auto,f_auto,w_1100,h_900,c_fill/');

      const img = document.createElement('img');
      img.src = src;
      d.appendChild(img);

      // ✅ CLICK BIG VIEW
      d.addEventListener('click', ()=> showPopup(src));

      // ✅ DELETE BUTTON FIX
      const del = document.createElement('button');
      del.className = 'delete-btn';
      del.innerHTML = '🗑';
      del.onclick = async(e)=>{
        e.stopPropagation();
        await fetch('/.netlify/functions/delete-image?id=' + imgObj.public_id);
        d.remove();
      };
      d.appendChild(del);

      // ✅ LIKE BUTTON
      const like = document.createElement("span");
      like.className = "like-btn";
      like.innerHTML = "❤️";

      const likeCount = document.createElement("span");
      likeCount.className = "like-count";
      likeCount.textContent = "0";

      let count = 0;
      like.onclick = function(e){
        e.stopPropagation();
        like.classList.toggle("liked");
        count = like.classList.contains("liked") ? count + 1 : count - 1;
        likeCount.textContent = count;
      };

      d.appendChild(like);
      d.appendChild(likeCount);

      return d;
    }

    async function fetchImages(){
      setStatus('Loading images…');
      const res = await fetch('/.netlify/functions/list-images');
      const json = await res.json();
      galleryEl.innerHTML = '';
      const items = json.images || json.resources || [];
      items.forEach(item=> galleryEl.appendChild(createTile(item)));
      setCount(items.length);
      setStatus('Loaded');
    }

    uploader.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      const form = new FormData();
      form.append('file', file);
      form.append('upload_preset', UPLOAD_PRESET);
      form.append('folder', FOLDER);

      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`, {
        method:'POST', body:form
      });
      const data = await res.json();
      galleryEl.prepend(createTile(data));
      setStatus('Uploaded');
    });

    refreshBtn.onclick = fetchImages;
    fetchImages();
  </script>
</body>
</html>
